[metadata]
name = PuggleSolvers
version = 1.3.2
author = Bruno Zuada Coelho, Aron Noordam
author_email = bruno.zuadacoelho@deltares.nl, aron.noordam@deltares.nl
description = Numerical solvers
long_description = file: README.md
long_description_content_type = text/markdown
license_expression = MIT
license_files = license
classifiers =
    Programming Language :: Python :: 3
    Operating System :: OS Independent

[options]
packages = solvers
install_requires =
    numpy>=1.18.1
    scipy>=1.4.1
    tqdm>=4.46.0
python_requires = >=3.11 <3.15

[options.extras_require]
testing =
    pytest>=9.2
    pytest-cov>=2.0
    tox>=3.24
# GPU support is optional and requires CuPy built for your local CUDA version.
# Install manually (do NOT rely on pip install .[gpu]):
#   pip install "cupy-cuda11x[ctk]"   # CUDA 11.x
#   pip install "cupy-cuda12x[ctk]"   # CUDA 12.x
#   pip install "cupy-cuda13x[ctk]"   # CUDA 13.x
# See https://docs.cupy.dev/en/stable/install.html
gpu =
    cupy